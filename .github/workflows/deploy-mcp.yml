name: Deploy MCP Worker

# This workflow is the SOURCE OF TRUTH; it is mirrored to OWNER/memex (public)
# via config/memex-sync-manifest.yml. The public mirror ships placeholder
# values in config/mcp-worker/wrangler.toml (GITHUB_REPO=YOUR_USERNAME/...,
# database_id=YOUR_D1_DATABASE_ID) and does NOT carry CLOUDFLARE_API_TOKEN /
# CLOUDFLARE_ACCOUNT_ID / GH_PAT secrets. Without the secret-presence guard
# below, every push to memex/main fired this workflow and crashed at
# `wrangler deploy` — five failed-run emails between 2026-04-10 and 2026-05-11.
#
# Guard semantics:
#   - On any repo with both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#     secrets set: typecheck runs, deploy runs (this is claude-memory + any
#     correctly-configured fork).
#   - On a repo without one of those secrets: typecheck still runs (useful
#     CI signal for Dependabot bumps and PRs), deploy + secret-put are
#     skipped with a clear log message.

on:
  push:
    branches: [main]
    paths:
      - 'config/mcp-worker/**'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

# Prevent concurrent deploys racing on the same Worker. Queued runs are
# coalesced to the newest by GitHub, so back-to-back merges still converge —
# but an IN-FLIGHT deploy is never cancelled: `cancel-in-progress: true`
# killed runs 140/141/146 mid-deploy on the nightly dependabot bursts
# (2026-09-01 / 09-04), and a cancel between `wrangler deploy` and the three
# `wrangler secret put` calls leaves a half-refreshed secret set until the
# next push. Same pattern as deploy-spanish-portal.yml (audit WF-04, 2026-09-07).
concurrency:
  group: deploy-mcp-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config/mcp-worker

    steps:
      - uses: actions/checkout@v7

      # actions/setup-node v4 with cache: 'npm' makes the npm install
      # ~60-80% faster on cache hits (typical: 30s -> 5-8s for our deps).
      # Cache key derived from package-lock.json — invalidates only when
      # deps change.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: config/mcp-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$CF_TOKEN_PRESENT" = "true" ] && [ "$CF_ACCOUNT_PRESENT" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present — deploy will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret missing."
            echo "Expected on OWNER/memex (public template — canonical deploy is from OWNER/REPO)."
            echo "If this is your fork: set both secrets at Settings -> Secrets and variables -> Actions, then re-run."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set worker secrets
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT_SECRET: ${{ secrets.GH_PAT }}
          # Same repo secret the telegram-bot worker uses. Enables the `tg_send`
          # MCP tool to push outbound Telegram from mobile/web (the bot token
          # never leaves Cloudflare). Skipped silently if the secret is unset.
          TELEGRAM_BOT_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Bearer for bare /mcp (portal-gated since 2026-08-12). The Cloudflare
          # MCP portal sends it via Custom headers; local hooks read the same
          # value from ~/.mcp_store/mcp_portal_token. Unset → bare /mcp closed.
          PORTAL_TOKEN_SECRET: ${{ secrets.PORTAL_TOKEN }}
        run: |
          if [ -n "$GH_PAT_SECRET" ]; then
            printf '%s' "$GH_PAT_SECRET" | npx wrangler secret put GITHUB_PAT
          else
            echo "::error::GH_PAT GitHub secret missing — the worker cannot read or write the memory repo without it."
            exit 1
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN_SECRET" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN_SECRET" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          else
            echo "TELEGRAM_BOT_TOKEN GitHub secret not set — tg_send will report 'not configured' until it is."
          fi
          if [ -n "$PORTAL_TOKEN_SECRET" ]; then
            printf '%s' "$PORTAL_TOKEN_SECRET" | npx wrangler secret put PORTAL_TOKEN
          else
            echo "PORTAL_TOKEN GitHub secret not set — bare /mcp stays fully closed (portal cannot authenticate)."
          fi
